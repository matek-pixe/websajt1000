<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>35xw — Sign in</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1e1f22; color: #dbdee1;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card { width: min(92vw, 420px); background: #2b2d31; border-radius: 16px; padding: 36px 32px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,.45); }
    h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: .5px; color: #fff; }
    p { margin: 0 0 24px; color: #b5bac1; line-height: 1.5; }
    .btn { display: inline-flex; align-items: center; gap: 10px; background: #5865f2; color: #fff; text-decoration: none;
           padding: 14px 22px; border-radius: 10px; font-weight: 600; font-size: 16px; transition: background .15s; }
    .btn:hover { background: #4752c4; }
    .btn svg { width: 22px; height: 22px; fill: currentColor; }
    .hint { margin-top: 22px; font-size: 13px; color: #949ba4; }
    .hint b { color: #dbdee1; }
  </style>
</head>
<body>
  <div class="card">
    <h1>35xw</h1>
    <p>Sign in with Discord to continue.<br />Access is only for members with the right role.</p>
    <a class="btn" href="/login">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.6 1.3a18.3 18.3 0 0 0-5.6 0L8.6 3a19.7 19.7 0 0 0-4.9 1.4C.6 9 0 13.4.3 17.8a19.9 19.9 0 0 0 6 3l1.3-2a12.9 12.9 0 0 1-2-1l.5-.4a14.2 14.2 0 0 0 12 0l.5.4-2 1 1.2 2a19.8 19.8 0 0 0 6-3c.4-5-.7-9.4-3.5-13.4ZM8.5 15.1c-1.2 0-2.1-1-2.1-2.3s.9-2.4 2.1-2.4 2.1 1.1 2.1 2.4-.9 2.3-2.1 2.3Zm7 0c-1.2 0-2.1-1-2.1-2.3s.9-2.4 2.1-2.4 2.1 1.1 2.1 2.4-.9 2.3-2.1 2.3Z"/></svg>
      Sign in with Discord
    </a>
    <div class="hint">Required role: <b>{{ROLES}}</b></div>
  </div>
</body>
</html>
