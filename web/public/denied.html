<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>35xw — Access denied</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1e1f22; color: #dbdee1;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card { width: min(92vw, 440px); background: #2b2d31; border-radius: 16px; padding: 36px 32px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,.45); }
    h1 { margin: 0 0 8px; font-size: 26px; color: #fff; }
    p { margin: 0 0 22px; color: #b5bac1; line-height: 1.55; }
    .role { display: inline-block; background: #1e1f22; border-radius: 8px; padding: 8px 12px; color: #fff; font-weight: 600; }
    .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }
    a { color: #fff; text-decoration: none; padding: 12px 18px; border-radius: 10px; font-weight: 600; }
    .primary { background: #5865f2; } .primary:hover { background: #4752c4; }
    .ghost { background: #3f4147; } .ghost:hover { background: #4b4e56; }
  </style>
</head>
<body>
  <div class="card">
    <h1>⛔ No access</h1>
    <p>{{REASON}}</p>
    <div>Required role: <span class="role">{{ROLES}}</span></div>
    <div class="row">
      <a class="primary" href="/login">Try again</a>
      <a class="ghost" href="/logout">Log out</a>
    </div>
  </div>
</body>
</html>
